
name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Run tests
        run: dotnet test -c Release --no-build

  container:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build container
        run: |
          dotnet publish src/SecretSanta.Web \
            -c Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerRepository=secret-santa \
            -p:ContainerImageTag=${{ github.sha }}

      - name: Verify container
        run: docker image inspect secret-santa:${{ github.sha }}

      - name: Export container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save secret-santa:${{ github.sha }} \
            -o container.tar

      - name: Upload container artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: container.tar
          retention-days: 1

  publish:
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.image.outputs.uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download container artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load container
        run: docker load -i container.tar

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYMENT_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker
        run: |
          gcloud auth configure-docker \
            ${{ vars.GCP_REGION }}-docker.pkg.dev \
            --quiet

      - name: Publish container
        env:
          IMAGE: ${{ vars.GCP_ARTIFACT_REGISTRY_URL }}/web
          TAG: ${{ github.sha }}
        run: |
          if gcloud artifacts docker images describe \
            "$IMAGE:$TAG" --quiet >/dev/null 2>&1; then
            echo "Image already exists. Reusing published image."
          else
            docker tag "secret-santa:$TAG" "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
          fi

      - name: Resolve image digest
        id: image
        env:
          IMAGE: ${{ vars.GCP_ARTIFACT_REGISTRY_URL }}/web
          TAG: ${{ github.sha }}
        run: |
          DIGEST=$(gcloud artifacts docker images describe \
            "$IMAGE:$TAG" \
            --format='value(image_summary.digest)')

          test -n "$DIGEST"
          echo "uri=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    env:
      SERVICE: secret-santa
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      IMAGE: ${{ needs.publish.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYMENT_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy candidate revision
        id: candidate
        run: |
          TAG="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SUFFIX="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REVISION="$SERVICE-$SUFFIX"

          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$PROJECT" \
            --revision-suffix="$SUFFIX" \
            --no-traffic \
            --tag="$TAG" \
            --quiet

          URL=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT" \
            --format=json | jq -er \
            --arg tag "$TAG" \
            '.status.traffic[] | select(.tag == $tag) | .url')

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Smoke test candidate
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          for ENDPOINT in /health/live /health/ready /; do
            curl --fail --silent --show-error \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 5 \
              --max-time 30 \
              "$CANDIDATE_URL$ENDPOINT"
          done

      - name: Promote candidate to production
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT" \
            --to-revisions="$REVISION=100" \
            --quiet

      - name: Remove candidate traffic tag
        if: always() && steps.candidate.outputs.tag != ''
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT" \
            --remove-tags="$TAG" \
            --quiet
