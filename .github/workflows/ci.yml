
name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Run tests
        run: dotnet test -c Release --no-build

  container:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore --locked-mode

      - name: Build container
        run: |
          dotnet publish src/SecretSanta.Web \
            -c Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerRepository=secret-santa \
            -p:ContainerImageTag=${{ github.sha }}

      - name: Verify container
        run: docker image inspect secret-santa:${{ github.sha }}

      - name: Export container
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save secret-santa:${{ github.sha }} \
            -o container.tar

      - name: Upload container artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: container.tar
          retention-days: 1

  publish:
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download container artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load container
        run: docker load -i container.tar

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYMENT_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker
        run: |
          gcloud auth configure-docker \
            ${{ vars.GCP_REGION }}-docker.pkg.dev \
            --quiet

      - name: Publish container
        env:
          IMAGE: ${{ vars.GCP_ARTIFACT_REGISTRY_URL }}/web
          TAG: ${{ github.sha }}
        run: |
          docker tag "secret-santa:$TAG" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
