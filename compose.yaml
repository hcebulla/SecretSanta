services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: secretsanta
      POSTGRES_USER: secretsanta
      POSTGRES_PASSWORD: secretsanta_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretsanta -d secretsanta"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: